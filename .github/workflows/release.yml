name: Release

# Cuts a GitHub release when a v* tag is pushed, building static Linux binaries
# with the version baked in from the tag. Runs nothing until you push a tag:
#   git tag -a v1.0.0 -m "DBWiz v1.0.0" && git push origin v1.0.0

on:
  push:
    tags: ["v*"]

permissions:
  contents: write # needed to create the release and upload assets

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
          check-latest: true

      - name: Build static binaries
        run: |
          VERSION="${GITHUB_REF_NAME}"
          mkdir -p dist
          for arch in amd64 arm64; do
            echo "building linux/$arch @ $VERSION"
            CGO_ENABLED=0 GOOS=linux GOARCH="$arch" \
              go build -trimpath -ldflags "-s -w -X main.version=${VERSION}" \
              -o "dist/dbwiz-linux-${arch}" .
          done
          # Checksums for verification.
          (cd dist && sha256sum dbwiz-* > checksums.txt)

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          body_path: CHANGELOG.md
          files: |
            dist/dbwiz-linux-amd64
            dist/dbwiz-linux-arm64
            dist/checksums.txt
